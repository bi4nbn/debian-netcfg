version: "3.8"

services:
    genieacs:
        image: drumsergio/genieacs:latest
        restart: unless-stopped
        depends_on:
            - mongo
        environment:
            GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo:27017/genieacs
            GENIEACS_UI_JWT_SECRET: SuperSecretKey123456
        ports:
            - "9090:7547" # ✅ 宿主机9090 → 容器内部7547（对外给光猫填9090）
            - "7557:7557" # NBI API
            - "7567:7567" # FS文件服务
            - "3000:3000" # UI网页
        volumes:
            - ./data/genieacs_ext:/opt/genieacs/ext
        networks:
            - genieacs_network
        healthcheck:
            test: [ "CMD", "wget", "--spider", "--quiet", "http://localhost:3000" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    mongo:
        image: mongo:8.0
        restart: unless-stopped
        volumes:
            - ./data/mongo_db:/data/db
            - ./data/mongo_configdb:/data/configdb
        expose:
            - "27017"
        networks:
            - genieacs_network
        healthcheck:
            test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 40s

    genieacs-sim:
        image: drumsergio/genieacs-sim:latest
        restart: unless-stopped
        depends_on:
            - genieacs
        environment:
            # ✅ docker内网直接访问容器原生7547，不走宿主机映射！
            GENIEACS_SIM_CWMP_URL: http://genieacs:7547
        networks:
            - genieacs_network

networks:
    genieacs_network:
